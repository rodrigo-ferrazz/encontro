[project]
name = "encontro-sp"
version = "0.1.0"
description = "Melhor ponto de encontro de carro entre N pessoas em São Paulo, com trânsito ao vivo"
authors = [
    { name = "Rodrigo Ferraz", email = "rodrigo@comp.vc" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "numpy>=2.5.5",
    "osmnx>=2.2.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.4",
    "scipy>=1.18.1",
    "typer>=0.29.2",
]

[project.scripts]
encontro = "encontro_sp.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
