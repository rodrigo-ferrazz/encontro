<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#050404" />
    <title>Encontro SP</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main id="app">
      <canvas id="map" aria-label="Mapa das ruas de São Paulo"></canvas>
      <div id="markers" aria-hidden="true"></div>
      <header class="top">
        <h1>Encontro SP</h1>
        <p id="status" role="status">Carregando a malha…</p>
      </header>
      <aside id="results" class="results" aria-label="Busca e resultados">
        <div class="tabs" role="tablist">
          <button id="tab-busca" class="tab" type="button" role="tab" aria-selected="true" aria-controls="busca">Busca</button>
          <button id="tab-res" class="tab" type="button" role="tab" aria-selected="false" aria-controls="results-body" disabled>Resultados</button>
          <button id="results-toggle" class="collapse" type="button" aria-expanded="true" aria-label="Recolher painel">▾</button>
        </div>
        <form id="busca" class="side-body" role="tabpanel" novalidate></form>
        <div id="results-body" class="side-body" role="tabpanel" hidden></div>
      </aside>
      <section class="bottom">
        <p id="legend" class="legend" hidden><span class="legend-text"></span> <span class="info" tabindex="0" role="note"></span></p>
        <div id="controls" class="controls" hidden>
          <button id="play" type="button" aria-label="Pausar">❚❚</button>
          <button id="restart" type="button" aria-label="Reiniciar">↺</button>
          <input id="scrub" type="range" min="0" max="1000" value="0" step="1" aria-label="Linha do tempo" />
          <output id="clock">0:00</output>
          <select id="speed" aria-label="Velocidade">
            <option value="0.5">0,5×</option>
            <option value="1" selected>1×</option>
            <option value="2">2×</option>
            <option value="4">4×</option>
          </select>
        </div>
        <footer class="foot">
          <span id="fps" hidden></span>
          <span class="attribution">© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors</span>
        </footer>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
